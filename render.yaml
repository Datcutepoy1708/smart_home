services:
  - type: web
    name: smart-home-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MQTT_URL
        sync: false
